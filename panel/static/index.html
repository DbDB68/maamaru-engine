<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まあ丸 — 本丸近侍パネル</title>
<link rel="stylesheet" href="/static/style.css?v=20260811-26">
</head>
<body>
<div id="app">
  <!-- 本丸舞台是まあ丸的固定门面，不隶属于任何单独页面。 -->
  <div id="dash-running" class="run-banner is-idle" data-scene="garden" style="display:none">
    <div class="run-track">
      <span class="run-brand" aria-label="まあ丸 本丸自动管家">
        <strong>まあ丸</strong>
        <small>本丸自动管家</small>
      </span>
      <span class="stage-fox" aria-hidden="true"></span>
      <span class="run-fox"></span>
    </div>
    <div class="run-info">
      <div id="run-place" class="run-place">本丸庭院</div>
      <div class="run-flavor" id="run-flavor"></div>
      <div class="run-sub" id="run-sub"></div>
    </div>
  </div>

  <!-- ====== 选项卡 ====== -->
  <nav id="tabs">
    <button class="tab active with-ui-icon ui-home" data-tab="home">概览</button>
    <button class="tab with-ui-icon ui-gear" data-tab="control">配置</button>
    <button class="tab with-ui-icon ui-singleplayer" data-tab="chat">近侍</button>
    <button class="tab with-ui-icon ui-wrench" data-tab="system">系统</button>
    <div class="top-right nav-tools">
      <span id="status-dot" class="dot dot-green"></span>
      <span id="status-text" class="status-label">待命中</span>
      <button id="btn-theme" class="icon-btn with-ui-icon ui-contrast" title="切换像素主题" aria-label="切换像素主题"></button>
    </div>
  </nav>

  <!-- ====== 面板内容 ====== -->
  <main id="main">

    <!-- ── 概览：左常用功能 / 中选中功能+日志 / 右统计表（按鹿目圆草图）── -->
    <section id="panel-home" class="tab-panel active">
      <div class="home-grid">
        <!-- 常用功能：按实际启动次数排序，只展示最常用的入口 -->
        <aside class="home-left">
          <div class="home-box-head">
            <span>常用功能</span>
          </div>
          <div class="func-carousel">
            <button id="func-prev" class="func-page-btn" type="button" aria-label="向前查看更多功能">‹</button>
            <div id="func-list"></div>
            <button id="func-next" class="func-page-btn" type="button" aria-label="向后查看更多功能">›</button>
          </div>
        </aside>

        <!-- 中：选中功能区 + 日志 -->
        <div class="home-center">
          <div id="func-detail" class="func-detail"></div>
          <div class="home-log-head">
            <span class="hl-title with-ui-icon ui-menu-list">日志</span>
            <div class="panel-actions">
              <div class="view-toggle" id="log-view-toggle" title="日志显示模式">
                <button class="vt-btn active with-ui-icon ui-chart" data-view="visual">可视化</button>
                <button class="vt-btn with-ui-icon ui-menu-list" data-view="raw">源码日志</button>
              </div>
              <button id="btn-noise" class="small-btn with-ui-icon ui-film" title="显示或收起界面导航过程">过程</button>
              <button id="btn-clear-logs" class="small-btn with-ui-icon ui-trash" title="清屏">清屏</button>
              <button id="btn-auto-scroll" class="small-btn active with-ui-icon ui-scroll" title="自动滚动">自动滚动</button>
            </div>
          </div>
          <div id="log-container">
            <div id="log-list"></div>
          </div>
          <div class="log-bar">
            <span id="log-count">0 条日志</span>
            <span id="log-status" class="bar-status">● 空闲</span>
          </div>
        </div>

        <!-- 右：统计表（日志 OCR 数据） -->
        <aside class="home-right">
          <div class="home-box-head">📊 本丸统计
            <span class="hr-tools">
              <span id="dash-updated" class="dash-updated"></span>
              <button id="btn-dash-refresh" class="small-btn icon-only with-ui-icon ui-return" title="刷新" aria-label="刷新本丸统计"></button>
            </span>
          </div>
          <div class="home-right-scroll">
            <div class="dash-card">
              <div class="dash-card-head">💰 家底 <span id="dash-snapshot-at" class="dash-dim"></span></div>
              <div class="res-tiles" id="dash-resources"></div>
              <div class="res-sub" id="dash-res-sub"></div>
              <div class="dash-furnaces" id="dash-furnaces"></div>
            </div>
            <div class="dash-card">
              <div class="dash-card-head">🏕 远征</div>
              <div id="dash-expeditions"></div>
              <div id="dash-schedule" class="dash-sched"></div>
            </div>
            <div class="dash-card">
              <div class="dash-card-head">📋 日课</div>
              <div id="dash-daily"></div>
            </div>
            <div class="dash-card">
              <div class="dash-card-head">🌱 内番</div>
              <div id="dash-naihanka"></div>
            </div>
          </div>
        </aside>
      </div>
    </section>

    <!-- ── 配置：双栏大气调参，运行按钮小小的 ── -->
    <section id="panel-control" class="tab-panel">
      <div class="panel-header">
        <h2 class="with-ui-icon ui-gear">配置 — 参数都在卡片上直接调，调好去概览点开始</h2>
        <div class="panel-actions">
          <span id="task-indicator" class="badge badge-idle">空闲</span>
        </div>
      </div>
      <label class="config-select-wrap" for="config-select">
        <span>选择要调整的功能</span>
        <select id="config-select" aria-label="选择要调整的功能"></select>
      </label>
      <!-- 配置：左分类导航 / 右选中项配置 -->
      <div id="config-layout">
        <nav id="config-nav"></nav>
        <div id="config-detail"></div>
      </div>

      <!-- 远征设置：JS 分别挂到「远征」和「自动排班」配置页 -->
      <div id="sched-dock" style="display:none">
        <div id="exp-common-panel" class="sched-card">
          <div class="sched-head">
            <span class="s-label">🧺 立刻远征</span>
            <span class="sched-hint">点击“远征”运行后立马派出</span>
          </div>
          <section class="exp-section">
            <div class="exp-section-head">
              <b>这次要派哪些部队</b>
              <span>不会到点自动接管游戏</span>
            </div>
            <div id="common-plan" class="common-plan"></div>
          </section>
          <div class="sched-tools">
            <span id="common-plan-msg" class="sched-msg"></span>
            <button id="common-plan-save" class="s-save with-ui-icon ui-check">保存手动安排</button>
          </div>
        </div>
        <div id="sched-panel" class="sched-card">
          <div class="sched-head">
            <span class="s-label">⏰ 自动排班</span>
            <span class="sched-hint">面板、模拟器和游戏必须保持开启</span>
          </div>
          <div class="schedule-explainer">
            <b>它会怎么工作？</b>
            <span>启用后，まあ丸在指定时间自动接管已经打开的游戏并派遣部队。不会主动启动模拟器或游戏，接管前会预告 15 秒。</span>
          </div>
          <section class="exp-section">
            <div class="exp-section-head">
              <b>自动排班</b>
              <label class="exp-switch"><input id="auto-enabled" type="checkbox"> 启用</label>
            </div>
            <div class="auto-grid">
              <label>模式
                <select id="auto-mode">
                  <option value="preset">攻略预设</option>
                  <option value="custom">自定义时刻表</option>
                </select>
              </label>
              <label>开始时间<input id="auto-start" type="time" value="08:00"></label>
              <label class="capitalist-check">
                <input id="auto-capitalist" type="checkbox">
                🏭 资本家模式（错过后补跑并顺延）
              </label>
            </div>
            <div id="preset-controls" class="preset-controls">
              <label>资源目标<select id="preset-name"></select></label>
              <label>第 1 路<select class="preset-team" data-lane="0"></select></label>
              <label>第 2 路<select class="preset-team" data-lane="1"></select></label>
              <label>第 3 路<select class="preset-team" data-lane="2"></select></label>
              <div id="preset-total" class="preset-total"></div>
              <div id="preset-preview" class="preset-preview"></div>
            </div>
            <div id="custom-controls" class="custom-controls" hidden>
              <div class="sched-rows" id="sched-rows"></div>
              <button id="sched-add" class="small-btn">＋ 添加一行</button>
            </div>
            <div class="pause-tools">
              <span>暂时不接管：</span>
              <button class="small-btn pause-exp" data-minutes="30">30 分钟</button>
              <button class="small-btn pause-exp" data-minutes="60">1 小时</button>
              <button class="small-btn pause-exp" data-minutes="999">今天</button>
              <button class="small-btn pause-exp" data-minutes="0">恢复</button>
              <span id="pause-state"></span>
            </div>
          </section>
          <div class="sched-tools">
            <span id="sched-msg" class="sched-msg"></span>
            <button id="sched-save" class="s-save with-ui-icon ui-check">保存自动排班</button>
          </div>
        </div>
      </div>

      <div class="control-footer">
        <button id="btn-stop-all" class="btn-danger with-ui-icon ui-stop" disabled>紧急停止</button>
      </div>
    </section>

    <!-- ── 聊天 ── -->
    <section id="panel-chat" class="tab-panel">
      <div class="panel-header">
        <h2 class="with-ui-icon ui-singleplayer">狐之助</h2>
        <button id="btn-clear-chat" class="small-btn with-ui-icon ui-trash" title="清空对话">清空</button>
      </div>
      <div id="chat-container">
        <div id="chat-messages">
          <div class="msg msg-system">
            <div class="msg-avatar">🦊</div>
            <div class="msg-bubble">
              <div class="msg-name">狐之助</div>
              <div class="msg-text">主君，您来了！本丸一切正常，有什么需要我帮忙的吗？</div>
            </div>
          </div>
        </div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="跟狐之助说点什么…" autocomplete="off">
        <button id="chat-send" disabled>发送</button>
      </div>
    </section>

    <!-- ── 系统：双栏，左分组导航 / 右表单 ── -->
    <section id="panel-system" class="tab-panel">
      <div class="panel-header">
        <h2 class="with-ui-icon ui-wrench">系统设置 — 协议端、播报、角色设定都集中在这里</h2>
        <div class="panel-actions">
          <span id="sys-status" class="cfg-status-inline"></span>
        </div>
      </div>
      <div id="system-layout">
        <div class="system-carousel">
          <button id="system-prev" class="system-page-btn" type="button" aria-label="向前查看更多系统设置">‹</button>
          <nav id="system-nav"></nav>
          <button id="system-next" class="system-page-btn" type="button" aria-label="向后查看更多系统设置">›</button>
        </div>
        <div id="system-detail"></div>
      </div>
    </section>

  </main>
</div>

<script src="/static/js/core.js?v=20260731-3"></script>
<script src="/static/js/theme-manager.js?v=20260809-1"></script>
<script src="/static/js/ui-feedback.js?v=20260731-1"></script>
<script src="/static/js/system-qq.js?v=20260731-1"></script>
<script src="/static/js/system-settings.js?v=20260811-4"></script>
<script src="/static/js/expedition-schedule.js?v=20260804-2"></script>
<script src="/static/js/dashboard.js?v=20260811-1"></script>
<script src="/static/js/log-viewer.js?v=20260804-1"></script>
<script src="/static/js/chat.js?v=20260804-1"></script>
<script src="/static/js/sword-picker.js?v=20260809-2"></script>
<script src="/static/js/param-form.js?v=20260809-2"></script>
<script src="/static/js/task-card.js?v=20260809-3"></script>
<script src="/static/js/list-editor.js?v=20260731-2"></script>
<script src="/static/js/task-runner.js?v=20260811-2"></script>
<script src="/static/app.js?v=20260811-7"></script>
</body>
</html>
