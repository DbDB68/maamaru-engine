name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 获取版本号
        id: version
        run: |
          echo "tag=${GITHUB_REF_NAME#refs/tags/}" >> $GITHUB_OUTPUT

      - name: 打包代码
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p dist/maamaru-$TAG
          rsync -a --exclude='.venv/' --exclude='resource/' --exclude='__pycache__/' \
            --exclude='*.pyc' --exclude='.git/' --exclude='.workbuddy/' \
            --exclude='_archive/' --exclude='debug/' --exclude='status/' \
            --exclude='dist/' --exclude='.create-maa-project/' \
            --exclude='*.egg-info/' --exclude='.uv-cache/' \
            ./ dist/maamaru-$TAG/
          cd dist
          zip -r maamaru-$TAG.zip maamaru-$TAG/
          echo "size=$(du -h maamaru-$TAG.zip | cut -f1)" >> $GITHUB_OUTPUT

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: まあ丸 ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          body: |
            ## 🦊 まあ丸 ${{ steps.version.outputs.tag }}

            **使用方法：**
            1. 下载 `maamaru-${{ steps.version.outputs.tag }}.zip` 并解压
            2. 下载 `resource.zip` 放到解压后的目录并解压（[手动下载](https://github.com/DbDB68/maamaru-engine/releases)）
            3. 双击 `启动面板.bat`
            4. 浏览器会自动打开 http://localhost:8080

            **需要：** Windows + Python 3.12+
          files: dist/maamaru-${{ steps.version.outputs.tag }}.zip
