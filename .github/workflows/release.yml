name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 获取版本号
        id: version
        shell: pwsh
        run: |
          "tag=$env:GITHUB_REF_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          "CURRENT_VERSION = `"$version`"" | Set-Content -LiteralPath "launcher/version.py" -Encoding utf8

      - name: 检查识别资源
        shell: pwsh
        run: |
          $required = @(
            "resource/base/model/ocr/rec.onnx",
            "resource/base/model/ocr/det.onnx",
            "resource/base/image/登录.png"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "缺少发布资源：$path" }
          }

      - name: 安装构建依赖
        run: python -m pip install . pyinstaller

      - name: 构建启动器
        run: python -m PyInstaller --clean --noconfirm "まあ丸启动器.spec"

      - name: 打包启动器
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $exe = "dist/まあ丸启动器.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "启动器构建失败：没有生成 $exe" }
          $package = "dist/package"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination $package
          Compress-Archive -Path "$package/*" -DestinationPath "dist/maamaru-launcher-$tag.zip" -Force

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: まあ丸 ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          body: |
            ## 🦊 まあ丸 ${{ steps.version.outputs.tag }}

            **使用方法：**
            1. 下载 `maamaru-launcher-${{ steps.version.outputs.tag }}.zip` 并解压
            2. 双击 `まあ丸启动器.exe`
            3. 启动器检查通过后，点击“启动まあ丸”

            Python、运行依赖、识别模板与 OCR 模型均已内置，不需要运行 `.bat`，也不需要另装资源包。

            **需要：** Windows 10/11
          files: dist/maamaru-launcher-${{ steps.version.outputs.tag }}.zip
