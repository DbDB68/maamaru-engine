name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 获取版本号
        id: version
        run: |
          echo "tag=${GITHUB_REF_NAME#refs/tags/}" >> $GITHUB_OUTPUT

      - name: 检查识别资源
        run: |
          test -f resource/base/model/ocr/rec.onnx
          test -f resource/base/model/ocr/det.onnx
          test -f resource/base/image/登录.png

      - name: 打包代码
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p dist/maamaru-$TAG
          rsync -a --exclude='.venv/' --exclude='__pycache__/' \
            --exclude='*.pyc' --exclude='.git/' --exclude='.workbuddy/' \
            --exclude='_archive/' --exclude='debug/' --exclude='status/' \
            --exclude='dist/' --exclude='.create-maa-project/' \
            --exclude='*.egg-info/' --exclude='.uv-cache/' \
            ./ dist/maamaru-$TAG/
          cd dist
          zip -r maamaru-$TAG.zip maamaru-$TAG/
          echo "size=$(du -h maamaru-$TAG.zip | cut -f1)" >> $GITHUB_OUTPUT

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: まあ丸 ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          body: |
            ## 🦊 まあ丸 ${{ steps.version.outputs.tag }}

            **使用方法：**
            1. 下载 `maamaru-${{ steps.version.outputs.tag }}.zip` 并解压
            2. 双击 `启动面板.bat`
            3. 浏览器会自动打开 http://localhost:8080

            识别模板与 OCR 模型已包含在压缩包中，不需要另外下载资源包。

            **需要：** Windows + Python 3.12+
          files: dist/maamaru-${{ steps.version.outputs.tag }}.zip
